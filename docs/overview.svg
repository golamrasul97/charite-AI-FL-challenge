<svg xmlns="http://www.w3.org/2000/svg" width="960" height="652" viewBox="0 0 960 652" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Privacy-preserving clinical AI across three hospital nodes: scores against the starter and how the federated model is trained</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <symbol id="lock" viewBox="0 0 12 14">
      <path d="M3 6 V4 a3 3 0 0 1 6 0 V6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <rect x="1" y="6" width="10" height="7.5" rx="1.6" fill="currentColor"/>
    </symbol>
  </defs>

  <rect x="1" y="1" width="958" height="650" rx="18" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- ============ header band ============ -->
  <path d="M1 19 a18 18 0 0 1 18 -18 h922 a18 18 0 0 1 18 18 v227 h-958 z" fill="url(#band)"/>
  <text x="40" y="50" font-size="22" font-weight="700" fill="#ffffff">Privacy-preserving clinical AI across three hospitals</text>
  <text x="40" y="74" font-size="13.5" fill="#cbd5e1">De-identify · extract · learn one readmission model together: without sharing patient records</text>

  <!-- score cards -->
  <g transform="translate(40,94)">
    <rect width="205" height="112" rx="12" fill="#ffffff" filter="url(#shadow)"/>
    <text x="16" y="28" font-size="12" font-weight="600" fill="#475569">AUTOMATED POINTS</text>
    <text x="16" y="66" font-size="30" font-weight="800" fill="#0f172a">37.68<tspan font-size="16" font-weight="600" fill="#64748b"> / 40</tspan></text>
    <text x="16" y="94" font-size="12.5" fill="#64748b">starter 31.84</text>
    <text x="189" y="94" font-size="12.5" font-weight="700" fill="#059669" text-anchor="end">+5.84</text>
  </g>
  <g transform="translate(265,94)">
    <rect width="205" height="112" rx="12" fill="#ffffff" filter="url(#shadow)"/>
    <text x="16" y="28" font-size="12" font-weight="600" fill="#475569">DE-IDENTIFICATION</text>
    <text x="16" y="66" font-size="30" font-weight="800" fill="#0f172a">1.00</text>
    <text x="16" y="94" font-size="12.5" fill="#64748b">starter 0.73</text>
    <text x="189" y="94" font-size="12.5" font-weight="700" fill="#059669" text-anchor="end">+0.27</text>
  </g>
  <g transform="translate(490,94)">
    <rect width="205" height="112" rx="12" fill="#ffffff" filter="url(#shadow)"/>
    <text x="16" y="28" font-size="12" font-weight="600" fill="#475569">EXTRACTION</text>
    <text x="16" y="66" font-size="30" font-weight="800" fill="#0f172a">1.00</text>
    <text x="16" y="94" font-size="12.5" fill="#64748b">starter 0.88</text>
    <text x="189" y="94" font-size="12.5" font-weight="700" fill="#059669" text-anchor="end">+0.12</text>
  </g>
  <g transform="translate(715,94)">
    <rect width="205" height="112" rx="12" fill="#ffffff" filter="url(#shadow)"/>
    <text x="16" y="28" font-size="12" font-weight="600" fill="#475569">READMISSION AUC</text>
    <rect x="137" y="15" width="54" height="18" rx="9" fill="#fef3c7"/>
    <text x="164" y="28" font-size="10.5" font-weight="600" fill="#92400e" text-anchor="middle">train CV</text>
    <text x="16" y="66" font-size="30" font-weight="800" fill="#0f172a">0.84</text>
    <text x="16" y="94" font-size="12.5" fill="#64748b">starter 0.68</text>
    <text x="189" y="94" font-size="12.5" font-weight="700" fill="#059669" text-anchor="end">+0.16</text>
  </g>

  <text x="40" y="224" font-size="11" fill="#94a3b8">Automated points, de-identification and extraction: official evaluator on the public validation set.</text>
  <text x="40" y="239" font-size="11" fill="#94a3b8">Readmission AUC: 5-fold cross-validation × 5 seeds on the training data. On validation the readmission score is on par with the starter (0.768 vs 0.773, only 6 readmissions).</text>

  <!-- ============ hospital nodes ============ -->
  <text x="40" y="282" font-size="15" font-weight="700" fill="#0f172a">How it works</text>
  <use href="#lock" x="684" y="271" width="11" height="13" color="#475569"/>
  <text x="920" y="282" font-size="12" fill="#475569" text-anchor="end">patient records never leave their hospital</text>

  <g transform="translate(40,298)" color="#1d4ed8">
    <rect width="272" height="124" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 5"/>
    <use href="#lock" x="18" y="16" width="12" height="14"/>
    <text x="38" y="28" font-size="14" font-weight="700" fill="#1e3a8a">BERLIN_NODE</text>
    <g font-size="12.5" fill="#1f2937">
      <rect x="16" y="44" width="116" height="28" rx="14" fill="#fff" stroke="#bfdbfe"/><text x="74" y="62.5" text-anchor="middle">1  De-identify</text>
      <rect x="140" y="44" width="116" height="28" rx="14" fill="#fff" stroke="#bfdbfe"/><text x="198" y="62.5" text-anchor="middle">2  Extract</text>
      <rect x="16" y="80" width="240" height="28" rx="14" fill="#fff" stroke="#bfdbfe"/><text x="136" y="98.5" text-anchor="middle">3  Train locally</text>
    </g>
  </g>
  <g transform="translate(344,298)" color="#047857">
    <rect width="272" height="124" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2" stroke-dasharray="7 5"/>
    <use href="#lock" x="18" y="16" width="12" height="14"/>
    <text x="38" y="28" font-size="14" font-weight="700" fill="#064e3b">CHENNAI_NODE</text>
    <g font-size="12.5" fill="#1f2937">
      <rect x="16" y="44" width="116" height="28" rx="14" fill="#fff" stroke="#a7f3d0"/><text x="74" y="62.5" text-anchor="middle">1  De-identify</text>
      <rect x="140" y="44" width="116" height="28" rx="14" fill="#fff" stroke="#a7f3d0"/><text x="198" y="62.5" text-anchor="middle">2  Extract</text>
      <rect x="16" y="80" width="240" height="28" rx="14" fill="#fff" stroke="#a7f3d0"/><text x="136" y="98.5" text-anchor="middle">3  Train locally</text>
    </g>
  </g>
  <g transform="translate(648,298)" color="#b45309">
    <rect width="272" height="124" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 5"/>
    <use href="#lock" x="18" y="16" width="12" height="14"/>
    <text x="38" y="28" font-size="14" font-weight="700" fill="#78350f">HYDERABAD_NODE</text>
    <g font-size="12.5" fill="#1f2937">
      <rect x="16" y="44" width="116" height="28" rx="14" fill="#fff" stroke="#fde68a"/><text x="74" y="62.5" text-anchor="middle">1  De-identify</text>
      <rect x="140" y="44" width="116" height="28" rx="14" fill="#fff" stroke="#fde68a"/><text x="198" y="62.5" text-anchor="middle">2  Extract</text>
      <rect x="16" y="80" width="240" height="28" rx="14" fill="#fff" stroke="#fde68a"/><text x="136" y="98.5" text-anchor="middle">3  Train locally</text>
    </g>
  </g>

  <!-- ============ exchange + server ============ -->
  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M176 424 C 176 450, 300 448, 330 470" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M480 424 L 480 468" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M784 424 C 784 450, 660 448, 630 470" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="490" y="450" font-size="11.5" fill="#475569">only model weights + patient count</text>

  <rect x="290" y="472" width="380" height="52" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="480" y="495" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="middle">FedAvg server</text>
  <text x="480" y="514" font-size="12" fill="#475569" text-anchor="middle">weighted average of the three models</text>

  <path d="M480 526 L 480 548" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="541" font-size="11.5" fill="#475569">final model</text>

  <!-- ============ outputs ============ -->
  <rect x="40" y="550" width="640" height="56" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="58" y="583" font-size="12.5" font-weight="700" fill="#0f172a">Each input case →</text>
  <g font-size="12.5" fill="#1f2937">
    <rect x="186" y="563" width="146" height="30" rx="15" fill="#fff" stroke="#cbd5e1"/><text x="259" y="582.5" text-anchor="middle">de-identified note</text>
    <rect x="342" y="563" width="112" height="30" rx="15" fill="#fff" stroke="#cbd5e1"/><text x="398" y="582.5" text-anchor="middle">clinical data</text>
    <rect x="464" y="563" width="200" height="30" rx="15" fill="#fff" stroke="#cbd5e1"/><text x="564" y="582.5" text-anchor="middle">readmission probability</text>
    <rect x="700" y="563" width="220" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1"/><text x="810" y="582.5" text-anchor="middle">+ experiment &amp; privacy summaries</text>
  </g>

  <!-- footer -->
  <rect x="40" y="620" width="26" height="12" rx="6" fill="#faf5ff" stroke="#8b5cf6" stroke-dasharray="4 3"/>
  <text x="74" y="630" font-size="11.5" fill="#64748b">Privacy extension (Task 4): differential privacy inside each hospital, ε ≈ 4.6. Measured, not used for the submitted predictions.</text>
</svg>
